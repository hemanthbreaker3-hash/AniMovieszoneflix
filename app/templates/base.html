<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07080c">
  <meta name="description" content="AniMoviesZoneflix — discover anime, movies and series.">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <title>{% block title %}AniMoviesZoneflix{% endblock %}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root{
      color-scheme:dark;
      --bg:#07080c;
      --bg-elevated:#0d0f16;
      --bg-card:#12151f;
      --bg-card-hover:#171b28;
      --line:rgba(255,255,255,.08);
      --line-strong:rgba(255,255,255,.14);
      --text:#f4f6fb;
      --muted:#8b93a7;
      --accent:#f5c518;
      --accent-2:#ff8a3d;
      --accent-soft:rgba(245,197,24,.14);
      --cyan:#3dd6c6;
      --danger:#ff5c5c;
      --radius:14px;
      --radius-sm:10px;
      --shadow:0 18px 50px rgba(0,0,0,.45);
      --font:"Outfit",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --font-display:"Syne","Outfit",system-ui,sans-serif;
      --max:1160px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      color:var(--text);
      font:500 15px/1.55 var(--font);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%,rgba(245,197,24,.09),transparent 50%),
        radial-gradient(ellipse 60% 40% at 90% 0%,rgba(61,214,198,.05),transparent 45%),
        var(--bg);
      letter-spacing:.01em;
      -webkit-font-smoothing:antialiased;
    }
    h1,h2,h3,h4,.brand-word{font-family:var(--font-display);font-weight:800;letter-spacing:-.02em}
    a{color:inherit;text-decoration:none}
    button,input,select{font:inherit}
    img{max-width:100%;display:block}
    .wrap{width:min(100% - 28px,var(--max));margin-inline:auto}

    /* —— Top bar —— */
    .topbar{
      position:sticky;top:0;z-index:80;
      backdrop-filter:blur(18px) saturate(1.2);
      -webkit-backdrop-filter:blur(18px) saturate(1.2);
      background:rgba(7,8,12,.82);
      border-bottom:1px solid var(--line);
    }
    .topbar-inner{
      width:min(100% - 28px,var(--max));
      margin:auto;
      min-height:64px;
      display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
      gap:14px;padding:10px 0;
    }
    .topbar-logo{
      display:inline-flex;align-items:center;gap:12px;
      transition:transform .2s ease;
    }
    .topbar-logo:hover{transform:translateY(-1px)}
    .topbar-logo img{
      width:42px;height:42px;border-radius:12px;object-fit:cover;
      border:1px solid var(--line-strong);
      box-shadow:0 8px 24px rgba(245,197,24,.18);
    }
    .brand-lockup{display:flex;align-items:center;gap:10px}
    .brand-mark{
      position:relative;
      width:28px;height:42px;
      display:grid;place-items:center;
    }
    .brand-mark span{
      position:absolute;
      font-family:var(--font-display);
      font-weight:800;font-size:11px;letter-spacing:.18em;
      writing-mode:vertical-rl;
      text-orientation:mixed;
      transform:rotate(180deg);
      background:linear-gradient(180deg,var(--accent),var(--accent-2));
      -webkit-background-clip:text;background-clip:text;color:transparent;
      opacity:.95;
    }
    .brand-mark::before{
      content:"";
      position:absolute;inset:4px 12px;
      border-left:2px solid var(--accent);
      border-right:2px solid rgba(61,214,198,.5);
      transform:skewY(-12deg);
      opacity:.85;
    }
    .brand-word{
      font-size:clamp(1.15rem,2.4vw,1.45rem);
      line-height:1;
      background:linear-gradient(105deg,#fff 20%,var(--accent) 55%,var(--accent-2) 100%);
      -webkit-background-clip:text;background-clip:text;color:transparent;
      text-shadow:0 10px 40px rgba(245,197,24,.12);
    }
    .brand-word em{
      font-style:normal;font-weight:800;
      color:var(--cyan);
      background:none;-webkit-background-clip:unset;background-clip:unset;
      margin-left:4px;
      letter-spacing:.08em;
    }
    .topbar-links{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .topbar-links a{
      padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;
      color:var(--muted);border:1px solid transparent;
      transition:color .18s,background .18s,border-color .18s,transform .18s;
    }
    .topbar-links a:hover{
      color:var(--text);background:rgba(255,255,255,.04);border-color:var(--line);
      transform:translateY(-1px);
    }
    .topbar-links a.active{
      color:#0b0c10;background:var(--accent);border-color:transparent;font-weight:700;
    }

    /* —— Search —— */
    .search-bar{
      display:flex;align-items:center;gap:10px;
      background:var(--bg-card);
      border:1px solid var(--line);
      border-radius:999px;
      padding:6px 6px 6px 16px;
      margin:18px 0 14px;
      transition:border-color .2s,box-shadow .2s;
    }
    .search-bar:focus-within{
      border-color:rgba(245,197,24,.45);
      box-shadow:0 0 0 4px var(--accent-soft);
    }
    .search-bar i{color:var(--muted);font-size:14px}
    .search-bar input{
      flex:1;min-width:0;background:transparent;border:0;outline:0;
      color:var(--text);font-size:14px;padding:10px 0;font-weight:500;
    }
    .search-bar input::placeholder{color:#6b7280}
    .search-bar button{
      border:0;border-radius:999px;cursor:pointer;
      padding:10px 18px;font-weight:800;font-size:13px;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      color:#0b0c10;
      transition:filter .15s,transform .15s;
    }
    .search-bar button:hover{filter:brightness(1.06);transform:translateY(-1px)}

    /* —— Banners —— */
    .announce{
      border-radius:var(--radius-sm);
      padding:12px 14px;margin:8px 0;
      font-size:13px;line-height:1.45;font-weight:500;
      border:1px solid var(--line);
    }
    .announce-red{
      background:linear-gradient(135deg,rgba(255,92,92,.12),rgba(255,92,92,.04));
      border-color:rgba(255,92,92,.28);color:#ffc9c9;
    }
    .announce-dark{
      background:var(--bg-card);color:var(--muted);
    }
    .announce a{color:var(--accent);font-weight:700}

    /* —— Sections —— */
    .section-head{
      display:flex;justify-content:space-between;align-items:center;
      gap:12px;margin:28px 0 14px;
    }
    .section-head h2{
      font-size:clamp(1.05rem,2vw,1.25rem);
      display:flex;align-items:center;gap:10px;
    }
    .section-head h2::before{
      content:"";width:4px;height:1.05em;border-radius:4px;
      background:linear-gradient(180deg,var(--accent),var(--cyan));
    }
    .chip,.cat-nav .chip,select.chip{
      display:inline-flex;align-items:center;gap:6px;
      background:var(--bg-card);border:1px solid var(--line);
      border-radius:999px;padding:7px 13px;font-size:12px;font-weight:600;
      color:var(--muted);cursor:pointer;
      transition:border-color .15s,color .15s,background .15s,transform .15s;
    }
    .chip:hover,.chip.active,select.chip:hover{
      color:var(--accent);border-color:rgba(245,197,24,.4);background:var(--accent-soft);
    }
    .cat-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

    /* —— Poster grid —— */
    .poster-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
      gap:16px;margin-top:8px;
    }
    .poster-card{
      background:var(--bg-card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      overflow:hidden;
      transition:transform .22s cubic-bezier(.2,.8,.2,1),border-color .2s,box-shadow .22s;
      content-visibility:auto;contain-intrinsic-size:260px 360px;
    }
    .poster-card:hover{
      transform:translateY(-6px);
      border-color:rgba(245,197,24,.35);
      box-shadow:var(--shadow);
      background:var(--bg-card-hover);
    }
    .poster-card img{
      width:100%;aspect-ratio:2/3;object-fit:cover;background:#1a1d28;
      transition:transform .35s ease;
    }
    .poster-card:hover img{transform:scale(1.04)}
    .poster-card .info{padding:12px 12px 14px}
    .poster-card .title{
      font-family:var(--font-display);font-weight:700;font-size:13px;line-height:1.3;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
      margin-bottom:5px;
    }
    .poster-card .meta{
      font-size:11px;color:var(--muted);line-height:1.35;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    }

    .trending-row{
      display:flex;gap:12px;overflow-x:auto;padding:6px 0 14px;
      scroll-snap-type:x mandatory;
      scrollbar-width:thin;scrollbar-color:#333 transparent;
    }
    .trending-row::-webkit-scrollbar{height:6px}
    .trending-row::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
    .trending-item{
      flex:0 0 118px;scroll-snap-align:start;
      border-radius:12px;overflow:hidden;
      border:1px solid var(--line);background:var(--bg-card);
      transition:transform .2s,border-color .2s;
    }
    .trending-item:hover{transform:translateY(-3px);border-color:rgba(245,197,24,.35)}
    .trending-item img{width:100%;aspect-ratio:2/3;object-fit:cover}

    main{padding:8px 0 96px}
    .footer{
      text-align:center;color:#5c6378;font-size:12px;padding:28px 0 48px;
      border-top:1px solid var(--line);
    }
    .footer strong{color:var(--muted);font-family:var(--font-display)}
    .muted{color:var(--muted)}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      min-height:42px;padding:0 16px;border-radius:var(--radius-sm);
      border:1px solid var(--line);background:var(--bg-card);color:var(--text);
      cursor:pointer;font-weight:700;font-size:13px;
      transition:border-color .15s,color .15s,transform .15s,background .15s;
    }
    .btn:hover{border-color:rgba(245,197,24,.4);color:var(--accent);transform:translateY(-1px)}
    .btn-yellow,.btn-accent{
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      color:#0b0c10;border:0;font-weight:800;
    }
    .btn-yellow:hover,.btn-accent:hover{filter:brightness(1.05);color:#0b0c10}

    /* —— Page hero strip —— */
    .page-hero{
      margin:10px 0 18px;padding:18px 0 6px;
      display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
    }
    .page-hero h1{
      font-size:clamp(1.4rem,3.5vw,2rem);
      background:linear-gradient(100deg,#fff,var(--accent));
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .page-hero p{color:var(--muted);font-size:14px;max-width:42ch}

    @media(max-width:640px){
      body{font-size:14px}
      .wrap,.topbar-inner{width:min(100% - 20px,var(--max))}
      .poster-grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
      .topbar-links a{padding:7px 10px;font-size:12px}
      .brand-word{font-size:1.1rem}
      .brand-mark{display:none}
    }
    @keyframes fadeUp{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:none}
    }
    .fade-up{animation:fadeUp .45s ease both}

    /* AniMoviesZoneflix anime-cinema visual system */
    :root{
      --bg:#09090d;--bg-elevated:#111116;--bg-card:#17171e;--bg-card-hover:#22212a;
      --line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.17);
      --text:#fffaf7;--muted:#a5a1ad;--accent:#ff6a00;--accent-2:#ff9b42;
      --accent-soft:rgba(255,106,0,.16);--cyan:#ff8a28;--radius:16px;
      --shadow:0 18px 55px rgba(0,0,0,.52);
      --font:"Outfit",system-ui,sans-serif;--font-display:"Syne","Outfit",sans-serif;
    }
    body{
      background:
        radial-gradient(ellipse 75% 38% at 5% -8%,rgba(255,106,0,.16),transparent 62%),
        radial-gradient(ellipse 65% 42% at 100% 5%,rgba(111,48,151,.13),transparent 60%),
        linear-gradient(180deg,#09090d 0%,#0b0a10 52%,#09090d 100%);
    }
    .topbar{background:rgba(9,9,13,.88);border-bottom-color:rgba(255,106,0,.18)}
    .topbar-logo>img{display:none}
    .brand-mark{width:34px;height:44px}
    .brand-mark span{font-size:12px;letter-spacing:.2em;background:linear-gradient(180deg,#ff9b42,#ff5b00);-webkit-background-clip:text;background-clip:text}
    .brand-mark::before{border-left-color:#ff6a00;border-right-color:rgba(255,155,66,.75)}
    .brand-word{
      font-family:var(--font-display);font-size:clamp(1.02rem,2.5vw,1.42rem);
      letter-spacing:-.055em;font-weight:900;
      background:linear-gradient(100deg,#fff 8%,#ffd2ad 43%,#ff6a00 83%,#ff9b42);
      -webkit-background-clip:text;background-clip:text;color:transparent;
      text-shadow:0 8px 35px rgba(255,106,0,.2);
    }
    .topbar-links a.active{background:linear-gradient(120deg,#ff6a00,#ff8a24);color:#160b04}
    .topbar-links a:hover{border-color:rgba(255,106,0,.28);background:rgba(255,106,0,.08)}
    .search-bar{background:rgba(22,21,28,.94);border-color:rgba(255,255,255,.1);box-shadow:0 12px 35px rgba(0,0,0,.2)}
    .search-bar:focus-within{border-color:rgba(255,106,0,.7);box-shadow:0 0 0 4px rgba(255,106,0,.12),0 12px 35px rgba(0,0,0,.25)}
    .search-bar button,.btn-yellow,.btn-accent{background:linear-gradient(125deg,#ff6a00,#ff9b42);color:#170a02}
    .page-hero{
      position:relative;overflow:hidden;margin:18px 0 20px;padding:clamp(24px,5vw,48px);
      min-height:155px;border:1px solid rgba(255,125,39,.22);border-radius:22px;
      background:linear-gradient(105deg,rgba(255,106,0,.18),rgba(28,17,35,.72) 54%,rgba(13,13,19,.96)),
        radial-gradient(circle at 85% 15%,rgba(255,142,55,.25),transparent 34%);
      box-shadow:0 20px 60px rgba(0,0,0,.25);
    }
    .page-hero:after{content:"アニメ";position:absolute;right:4%;bottom:-32px;font:900 clamp(4rem,12vw,8rem)/1 var(--font-display);color:rgba(255,255,255,.035);letter-spacing:-.08em;pointer-events:none}
    .page-hero h1{font-size:clamp(1.8rem,5vw,3.1rem);background:linear-gradient(100deg,#fff 15%,#ffd1ad 55%,#ff7b19);-webkit-background-clip:text;background-clip:text;color:transparent}
    .page-hero p{color:#c4bdc7;font-size:14px;max-width:52ch}
    .poster-grid{gap:17px}
    .poster-card{
      overflow:hidden;border-radius:13px;background:linear-gradient(180deg,#1b1921,#111116);
      border:1px solid rgba(255,255,255,.07);box-shadow:0 8px 24px rgba(0,0,0,.24);
      transition:transform .24s ease,border-color .24s ease,box-shadow .24s ease;
    }
    .poster-card:hover{transform:translateY(-6px) scale(1.012);border-color:rgba(255,116,24,.58);box-shadow:0 18px 38px rgba(0,0,0,.45),0 0 24px rgba(255,106,0,.12)}
    .poster-card img{transition:transform .4s ease;aspect-ratio:2/3;object-fit:cover}
    .poster-card:hover img{transform:scale(1.045)}
    .poster-card .info{background:linear-gradient(180deg,transparent,rgba(10,9,14,.96))}
    .poster-card .title{font-weight:800;letter-spacing:-.015em}
    .chip{border-color:rgba(255,255,255,.1)}
    .chip.active,.cat-nav .chip.active{background:rgba(255,106,0,.16);border-color:rgba(255,106,0,.55);color:#ffad70}
    .section-head h2{font-weight:900;letter-spacing:-.04em}
    .section-head h2:before{content:"";display:inline-block;width:4px;height:1em;margin-right:10px;vertical-align:-.12em;border-radius:5px;background:linear-gradient(#ff9b42,#ff5b00)}
    .announce-red{background:rgba(255,106,0,.08);border-color:rgba(255,106,0,.24);color:#ffd3b7}
    .announce-dark{background:#15131b}
    .btn,.pbtn,.select{border-radius:12px}
    .footer{border-top-color:rgba(255,106,0,.16);color:#8f8994}
    @media(max-width:640px){
      .topbar-inner{gap:8px}.brand-word{font-size:1.02rem}.brand-mark{display:grid;width:25px}
      .topbar-links{width:100%;justify-content:flex-start}
      .page-hero{padding:22px 18px;min-height:135px}
      .poster-grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:11px}
    }
    {% block head %}{% endblock %}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="topbar-logo" href="/" title="AniMoviesZoneflix Home">
        <img src="/static/images/logo.jpg" alt="AniMoviesZoneflix logo" width="42" height="42">
        <span class="brand-lockup">
          <span class="brand-mark" aria-hidden="true"><span>AZF</span></span>
          <span class="brand-word">AniMoviesZoneflix</span>
        </span>
      </a>
      <nav class="topbar-links" aria-label="Primary">
        <a href="/" class="{% block nav_home %}{% endblock %}">Home</a>
        <a href="/search" class="{% block nav_search %}{% endblock %}">Search</a>
        <a href="/panel">Panel</a>
      </nav>
    </div>
  </header>
  <main class="wrap fade-up">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer wrap">
    <strong>AniMoviesZoneflix</strong> · Stream &amp; download with speed and clarity
  </footer>
</body>
</html>
